# 选择调试器为jlink

source [find interface/cmsis-dap.cfg]
# source [find interface/jlink.cfg] #使用cmsis-dap硬件进行调试,注意其他地方也要更改
# OpenOCD作为GDB和硬件调试器的桥梁(为硬件提供抽象,把接口给GDB),支持多种硬件调试器.
# OpenOCD会自动在其根目录的share/openocd/scripts/interface里面寻找对应的配置文件

# 选择接口为SWD
transport select swd

# 选择目标芯片
source [find target/stm32f4x.cfg]
# OpenOCD会自动在其根目录的share/openocd/scripts/target里面寻找对应的配置文件

# 复位方式: 只用内核软复位(SYSRESETREQ), 不依赖调试器的 nRST 引脚。
# 原因: stm32f4x.cfg:76 默认是 "reset_config srst_nogate"(靠 SRST 硬件线),
#       只接 SWD 四线(SWDIO/SWCLK/GND, 没有 nRST)时 reset 会失败,
#       导致烧录后 MCU 停在 reset halt 的 halt 态 (表现为"烧完不跑/没复位")。
# ⚠️ 必须放在 source target 之后才能覆盖它的设置。
# 若已把调试器 nRST 接到板子 NRST, 想改用硬件复位, 注释掉这一行即可。
reset_config none